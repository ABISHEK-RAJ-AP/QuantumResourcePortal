  PROVIDER_ADMIN:
    name: "Provider Administrator"
    assignable_scope: PROVIDER
    description: "Create provider (DRAFT); submit onboarding/manifests for own provider; read own provider's backends and connectors. Cannot transition provider state."
    permissions:
