      - asset:read
      - provider:read
      - provider:create
      - provider:manifest:write
      - backend:read
      - connector:read
      - sla:read
      - ticket:read
      - ticket:create

  AUDITOR:
    name: "Auditor"
    assignable_scope: TENANT
    description: "Read everything in QRP; audit read, export and chain verification. No writes."
    permissions:
      - governance:read
      - user:read
      - membership:read
      - role:read
      - permission:read
      - project:read
      - asset:read
      - pool:read
      - provider:read
      - backend:read
      - connector:read
      - policy:read
      - quota:read
      - workload:read
      - approval:read
      - reservation:read
      - dispatch:read
      - usage:read
      - report:export
      - sla:read
      - procurement:read
      - entitlement:read
      - ticket:read
      - alert:read
      - incident:read
      - audit:read
      - audit:export
      - audit:verify
      - settings:read

  RESOURCE_MANAGER:
    name: "Resource Manager"
    assignable_scope: TENANT
    description: "Inventory create/update/retire/import, topology, procurement, entitlements, SLA targets. Pending NF-01/CF-09 — kept as specified in LLD. Cannot approve or manage roles."
    permissions:
      - governance:read
      - project:read
      - asset:read
      - asset:create
      - asset:update
      - asset:retire
      - asset:import
      - topology:write
      - pool:read
      - pool:manage
      - provider:read
      - backend:read
      - policy:read
      - usage:read
      - report:export
      - sla:read
      - sla:target:write
      - procurement:read
      - procurement:write
      - entitlement:read
      - entitlement:grant
      - ticket:read
      - ticket:create

  ASSISTANT:
    name: "Assistant (service)"
    assignable_scope: PROJECT
    system_only: true          # seeded, never assignable to a human (plan §3)
    description: "SVC-19 drafting identity. No QRP permissions (REQ-062)."
    permissions: []

# ---------------------------------------------------------------------------
# SRS Appendix B (normative) — asserted so validate_permissions.py fails if any
# cell is reduced. Each entry: the SRS cell, and the QRP permission(s) that
# satisfy it for the listed roles. "A" (administer) implies the module's write
# + manage permissions; "R/W" implies read + the stated write.
# ---------------------------------------------------------------------------
srs_appendix_b:
  # QRP column of the role matrix
  - cell: "Platform administrator — QRP: A"
    roles: [PLATFORM_ADMIN]
    satisfied_by: [governance:read, asset:create, provider:state:transition, policy:publish, membership:admin, settings:write]
  - cell: "Operator — QRP: R"
    roles: [OPERATOR]
    satisfied_by: [governance:read, asset:read, workload:read]
  - cell: "Researcher/developer — QRP: R (project)"
    roles: [RESEARCHER]
    satisfied_by: [governance:read, asset:read, workload:read]
  - cell: "Project owner — QRP: R/W approvals (stage 1)"
    roles: [PROJECT_OWNER]
    satisfied_by: [approval:read, approval:decide]
  - cell: "Quota approver — QRP: R/W approvals (stage 2)"
    roles: [QUOTA_APPROVER]
    satisfied_by: [approval:read, approval:decide, workload:authorize]
  - cell: "Provider administrator — QRP: R/W manifests"
    roles: [PROVIDER_ADMIN]
    satisfied_by: [provider:read, provider:manifest:write]
  - cell: "Auditor — QRP: R; Audit export: R"
    roles: [AUDITOR]
    satisfied_by: [governance:read, asset:read, audit:read, audit:export]
  # Resource/action/scope table (normative)
  - cell: "Project — read/write — project membership role"
    roles: [PLATFORM_ADMIN, PROJECT_OWNER]
    satisfied_by: [project:read, project:update]
  - cell: "Workload — submit for review — project permission"
    roles: [RESEARCHER, PROJECT_OWNER, PLATFORM_ADMIN]
    satisfied_by: [workload:submit]
  - cell: "Workload — dispatch — approval + quota policy"
    roles: [PROJECT_OWNER, PLATFORM_ADMIN]
    satisfied_by: [workload:dispatch]
  - cell: "Approval — approve/reject — approver role for stage"
    roles: [PROJECT_OWNER, QUOTA_APPROVER]
    satisfied_by: [approval:decide]
  - cell: "Provider manifest — create/update — provider administrator"
    roles: [PROVIDER_ADMIN, PLATFORM_ADMIN]
    satisfied_by: [provider:manifest:write]
  - cell: "Connector credential — rotate/test — platform administrator"
    roles: [PLATFORM_ADMIN]
    satisfied_by: [connector:credential:rotate, connector:configure]
  - cell: "Audit/export — export — audit export policy"
    roles: [AUDITOR, PLATFORM_ADMIN, PROJECT_OWNER]
    satisfied_by: [audit:export]
  - cell: "Inventory asset — read/write — resource manager role"
    roles: [RESOURCE_MANAGER, PLATFORM_ADMIN]
    satisfied_by: [asset:read, asset:create, asset:update]

# ---------------------------------------------------------------------------
# Invariants asserted by the validator (plan §3, §9).
# ---------------------------------------------------------------------------
invariants:
  platform_admin_must_not_hold: [approval:decide]   # SoD / least privilege (LLD §11.2)
  deny_by_default: true
