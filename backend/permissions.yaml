  PROJECT_OWNER:
    name: "Project Owner / Project Administrator"
    assignable_scope: PROJECT
    description: "Researcher rights plus stage-1 approvals where assigned, project membership admin (project-scoped roles only), dispatch, and project audit read/export. Cannot decide own workloads (SoD)."
    permissions:
      - governance:read
      - user:read
      - membership:read
      - membership:admin
      - project:read
      - project:update
      - asset:read
      - pool:read
      - provider:read
      - backend:read
      - policy:read
      - quota:read
      - workload:read
      - workload:create
      - workload:submit
      - workload:withdraw
      - approval:read
      - approval:decide
      - reservation:read
      - reservation:create
      - reservation:cancel
      - dispatch:read
      - workload:dispatch
      - usage:read
      - report:export
      - entitlement:read
      - ticket:read
      - ticket:create
      - audit:read
      - audit:export

  QUOTA_APPROVER:
    name: "Quota Approver"
    assignable_scope: TENANT
    description: "Stage-2 (quota/policy) approvals; authorise/re-authorise; quota ledger maintenance; entitlement read/grant. Cannot decide own workloads (SoD)."
    permissions:
      - governance:read
      - project:read
      - asset:read
      - provider:read
      - backend:read
      - policy:read
      - quota:read
      - quota:manage
      - workload:read
      - approval:read
      - approval:decide
