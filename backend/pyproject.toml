[project]
name = "qre-qrp-backend"
version = "0.1.0"
description = "Quantum Resource Portal (QRP) backend — QRE governance workspace API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: test needs a reachable PostgreSQL database (QRE_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:qre.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # Depends()/Field() in argument defaults is the intended FastAPI/Pydantic idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"qre/core/errors.py" = ["E501"]  # catalogue kept one-code-per-line like LLD Appendix C
"qre/services/*/models.py" = ["E501"]  # one column per line, mirroring LLD Appendix B
"scripts/validate_permissions.py" = ["E501"]  # generated-doc row templates are long by design
